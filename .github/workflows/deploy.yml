name: Deploy PCA Study

on:
  push:
    branches:
      - main

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          pwd
          ls -R

      - name: Validate HTML exists
        run: |
          test -f web/index.html

      - name: Validate HTML structure
        run: |
          grep -q "<html" web/index.html
          grep -q "</html>" web/index.html
          grep -q "<body" web/index.html
          grep -q "</body>" web/index.html

      - name: Check HTML size
        run: |
          SIZE=$(wc -c < web/index.html)

          echo "HTML size: $SIZE bytes"

          if [ "$SIZE" -lt 100 ]; then
            echo "HTML file too small"
            exit 1
          fi

      - name: Backup current version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /var/www/backups

            cp /var/www/pca-study/index.html \
            /var/www/backups/index-$(date +%F-%H-%M-%S).html || true

      - name: Create target directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /var/www/pca-study

      - name: Deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "web/*"
          target: "/var/www/pca-study"

      - name: Validate nginx config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            nginx -t

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            systemctl reload nginx

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost)

            echo "HTTP Status: $STATUS"

            if [ "$STATUS" -ne 200 ]; then
              echo "Health check failed"
              exit 1
            fi

      - name: Deployment Success
        run: |
          echo "Deploy completed successfully"