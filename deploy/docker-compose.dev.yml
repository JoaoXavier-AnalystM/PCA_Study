name: pca-notes-dev

services:
  pca-notes:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: pca-notes-dev:latest
    container_name: pca-notes-dev
    restart: unless-stopped
    ports:
      - "0.0.0.0:8082:80"
    cpus: "0.5"
    mem_limit: 256M
    memswap_limit: 256M
    pids_limit: 128
