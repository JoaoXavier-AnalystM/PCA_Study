# Template do nginx DO HOST (VPS) — não é usado dentro do container.
# Copiar para /etc/nginx/conf.d/pca-study.conf na VPS e ajustar caminhos de certificado.

# --- PROD: https://pca-guide.joaoxavier.app.br -> container 8081 ---
server {
    listen 80;
    server_name pca-guide.joaoxavier.app.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name pca-guide.joaoxavier.app.br;

    # Ajustar caminhos reais dos certificados (certbot / Cloudflare origin)
    ssl_certificate     /etc/letsencrypt/live/pca-guide.joaoxavier.app.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pca-guide.joaoxavier.app.br/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

