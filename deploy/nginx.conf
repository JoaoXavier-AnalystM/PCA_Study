server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # hardening headers (site estático, sem conteúdo misto)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/css text/plain application/javascript application/json image/svg+xml;

    # HTML: revalidar sempre (site muda com frequência)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Assets: cache longo
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
